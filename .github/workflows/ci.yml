name: CI

on:
  push:
    branches: [master, v2]
    paths-ignore: [docs/**]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '#skip-deploy') && !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      # v2 deploys use the V2_-prefixed secrets; master uses the unprefixed ones.
      PREFIX: ${{ github.ref_name == 'v2' && 'V2_' || '' }}
    steps:
      - name: Execute deploy command
        uses: appleboy/ssh-action@v1
        env:
          BRANCH: ${{ github.ref_name }}
          SITE_URL: ${{ github.ref_name == 'v2' && 'http://118.138.233.239/' || 'https://judge.monashaps.com/' }}
          ENV_MYSQL: ${{ secrets[format('{0}ENV_MYSQL', env.PREFIX)] }}
          ENV_MYSQL_ADMIN: ${{ secrets[format('{0}ENV_MYSQL_ADMIN', env.PREFIX)] }}
          ENV_SITE: ${{ secrets[format('{0}ENV_SITE', env.PREFIX)] }}
        with:
          host: ${{ secrets[format('{0}HOST', env.PREFIX)] }}
          USERNAME: ${{ secrets[format('{0}USERNAME', env.PREFIX)] }}
          KEY: ${{ secrets[format('{0}SSH_KEY', env.PREFIX)] }}
          envs: BRANCH,SITE_URL,ENV_MYSQL,ENV_MYSQL_ADMIN,ENV_SITE
          script: |
            set -euo pipefail

            mkdir -p mcpc-online-judge
            cd mcpc-online-judge
            if [ ! -d repo/.git ]; then
              git clone --branch "$BRANCH" https://github.com/MonashAPS/mcpc-online-judge.git repo
            fi
            cd repo/

            # The checkout is a deployment target: make it match the branch exactly.
            # The site checkout under dmoj/repo is bind-mounted into the running
            # containers, so update it in place rather than deleting it: a failed
            # build below must leave the live site with its source intact.
            git fetch origin "$BRANCH"
            git checkout -q "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            git submodule sync --recursive
            if [ -d dmoj/repo/.git ] || [ -f dmoj/repo/.git ]; then
              sudo git -C dmoj/repo clean -fdxq
            fi
            git submodule update --init --recursive --force

            rm -f dmoj/environment/*
            printf '%s' "$ENV_MYSQL" | base64 -d > dmoj/environment/mysql.env
            printf '%s' "$ENV_MYSQL_ADMIN" | base64 -d > dmoj/environment/mysql-admin.env
            printf '%s' "$ENV_SITE" | base64 -d > dmoj/environment/site.env

            cd dmoj
            sudo ./scripts/run_all

            # Fail the deploy if the site does not come back healthy.
            for i in $(seq 1 24); do
              if curl -fsS -o /dev/null --max-time 10 "$SITE_URL"; then
                echo "site healthy after $((i * 5))s"
                exit 0
              fi
              sleep 5
            done
            echo "site did not become healthy; recent site logs:"
            sudo docker compose logs --tail 60 site
            exit 1
