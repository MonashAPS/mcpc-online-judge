# Plain HTTP for access by raw IP (used before DNS points at this host).
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/site.locations;
}

# Staging: staging.judge.monashaps.com (same site, its own certificate).
server {
    listen       80;
    listen       [::]:80;
    server_name  staging.judge.monashaps.com;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name  staging.judge.monashaps.com;

    ssl_certificate /etc/letsencrypt/live/staging.judge.monashaps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.judge.monashaps.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/conf.d/site.locations;
}

server {
    listen       80;
    listen       [::]:80;
